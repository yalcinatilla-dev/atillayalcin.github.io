<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATILLAYALCIN_AI_OS | Stratejik Veri Analiz Merkezi</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --neon-blue: #00d2ff; --dark-bg: #0a0a0a; --glass: rgba(255, 255, 255, 0.05); }
        body { background-color: var(--dark-bg); color: white; font-family: 'Inter', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 90%; max-width: 600px; background: rgba(20, 20, 20, 0.95); padding: 40px; border-radius: 20px; border: 1px solid rgba(0, 210, 255, 0.3); box-shadow: 0 0 50px rgba(0, 210, 255, 0.1); text-align: center; }
        h1 { font-size: 1.8rem; letter-spacing: 2px; color: var(--neon-blue); margin-bottom: 30px; }
        .upload-zone { border: 2px dashed rgba(0, 210, 255, 0.4); padding: 40px; border-radius: 15px; cursor: pointer; transition: 0.3s; margin-bottom: 25px; }
        .upload-zone:hover { background: rgba(0, 210, 255, 0.05); border-color: var(--neon-blue); }
        input[type="email"], input[type="text"], select { width: 100%; padding: 15px; margin-bottom: 20px; background: #111; border: 1px solid #333; border-radius: 8px; color: white; box-sizing: border-box; }
        .btn { width: 100%; padding: 18px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; text-transform: uppercase; margin-bottom: 15px; }
        .btn-primary { background: linear-gradient(90deg, #00d2ff, #3a7bd5); color: white; }
        .btn-secondary { background: rgba(255, 255, 255, 0.1); color: #00d2ff; border: 1px solid var(--neon-blue); }
        #final-log { margin-top: 20px; font-size: 0.9rem; font-weight: 500; }
        .audit-box { margin-top: 40px; padding: 25px; background: rgba(255, 255, 255, 0.02); border-radius: 15px; border: 1px solid rgba(255, 204, 0, 0.2); text-align: left; }
    </style>
</head>
<body>

<div class="container">
    <h1>ATILLAYALCIN_AI_OS</h1>

    <input type="email" id="final-email" placeholder="Kurumsal E-posta Adresiniz (zorunlu)" required>

    <div class="upload-zone" onclick="document.getElementById('file-input').click()">
        <i class="fas fa-cloud-upload-alt" style="font-size: 3rem; color: var(--neon-blue); margin-bottom: 15px;"></i>
        <p id="final-file-list">Analiz edilecek dökümanı buraya sürükleyin veya seçin</p>
        <input type="file" id="file-input" style="display:none" onchange="updateFileList(this.files)">
    </div>

    <button class="btn btn-primary" onclick="triggerInference(false)">Otonom Analizi Başlat</button>

    <div class="audit-box">
        <h3 style="color: #ffcc00; margin-top: 0; font-size: 1.1rem;">🔥 GPU Verimlilik & Maliyet Denetimi</h3>
        <p style="font-size: 0.8rem; color: #aaa; margin-bottom: 15px;">Açık kaynak optimizasyonu ile maliyet düşürme analizi. (Kalan Kontenjan: 4)</p>
        
        <label style="font-size: 0.75rem; color: var(--neon-blue);">Mevcut Model:</label>
        <select id="audit-model">
            <option value="GPT-4/Claude">GPT-4 / Claude-3</option>
            <option value="Llama/Mistral">Llama-3 / Mistral (Açık Kaynak)</option>
            <option value="Diger">Diğer / In-House</option>
        </select>

        <label style="font-size: 0.75rem; color: var(--neon-blue);">Aylık Token/GPU Tüketimi:</label>
        <input type="text" id="audit-usage" placeholder="Örn: 100M Token veya 2x A100">

        <label style="font-size: 0.75rem; color: var(--neon-blue);">Gizlilik Hassasiyeti:</label>
        <select id="audit-privacy">
            <option value="Cok Yuksek">Çok Yüksek (On-Premise)</option>
            <option value="Orta">Orta (Hibrid)</option>
            <option value="Dusuk">Düşük (Public API)</option>
        </select>

        <button class="btn btn-secondary" onclick="triggerInference(true)">Verimlilik Denetimini Gönder</button>
    </div>

    <div id="final-log">Sistem Hazır.</div>
</div>

<script>
    let selectedFiles = [];

    function updateFileList(files) {
        selectedFiles = Array.from(files);
        const list = document.getElementById('final-file-list');
        if (selectedFiles.length > 0) {
            list.innerHTML = `<i class="fas fa-file-pdf"></i> ${selectedFiles[0].name} hazır.`;
        }
    }

    async function triggerInference(isGpuAudit = false) {
        const emailInput = document.getElementById('final-email').value.trim();
        const log = document.getElementById('final-log');
        
        if (!emailInput || selectedFiles.length === 0) {
            log.innerText = "Hata: Kurumsal e-posta ve döküman gereklidir.";
            log.style.color = "#ff4444";
            return;
        }

        // --- KURUMSAL MAİL FİLTRESİ ---
        const freeEmailDomains = ['gmail.com', 'yahoo.com', 'hotmail.com', 'outlook.com', 'icloud.com', 'yandex.com', 'mail.ru'];
        const emailDomain = emailInput.split('@')[1].toLowerCase();
        if (freeEmailDomains.includes(emailDomain)) {
            log.innerText = "Sistem Uyarı: Sadece kurumsal e-posta adresleri kabul edilmektedir.";
            log.style.color = "#ffcc00";
            return;
        }

        log.innerText = "Veri Otonom Tünele Aktarılıyor...";
        log.style.color = "#00d2ff";

        try {
            const formData = new FormData();
            formData.append('email', emailInput);
            formData.append('file', selectedFiles[0]);
            formData.append('is_audit', isGpuAudit);
            
            if (isGpuAudit) {
                formData.append('model', document.getElementById('audit-model').value);
                formData.append('usage', document.getElementById('audit-usage').value);
                formData.append('privacy', document.getElementById('audit-privacy').value);
            }

            const response = await fetch('https://api.atillayalcin.ai/api/v1/inference', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();
            
            if (data.status === "limit_reached") {
                log.innerText = `Uyarı: Ücretsiz limit dolmuştur. İletişim: contact@atillayalcin.ai`;
                log.style.color = "#ffcc00";
                return;
            }

            if (data.status === "success") {
                log.innerText = "Başarılı! Veriler iletildi. Atilla Yalçın bizzat dönüş yapacaktır.";
                log.style.color = "#00ff88";
            } else {
                throw new Error(data.message);
            }
        } catch (error) {
            log.innerText = "Sistem Hatası: " + error.message;
            log.style.color = "#ff4444";
        }
    }
</script>

</body>
</html>
