name: "Strategic GPU Audit Tool"
on: 
  workflow_dispatch:
    inputs:
      gpu_model:
        description: 'Model (H100, B200)'
        default: 'H100'
      node_count:
        description: 'Node Count'
        default: '1'

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Run GPU Engine
        env:
          GPU_MODEL: ${{ github.event.inputs.gpu_model }}
          NODE_COUNT: ${{ github.event.inputs.node_count }}
        run: python gpu_engine.py

      - name: Commit and Push Report
        run: |
          git config --global user.name "ATILLAYALCIN-AI-OS"
          git config --global user.email "ai-os@atillayalcin.ai"
          git add latest_audit.json
          git commit -m "Auto-Update: Strategic Report [skip ci]" || echo "No changes"
          git push

      - name: Send Strategic Audit Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp-relay.brevo.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[Sovereign Report] GPU Audit Complete"
          to: atilla@atillayalcin.ai
          from: contact@atillayalcin.ai
          body: |
            STRATEGIC AUDIT REPORT (v100.0.0)
            ----------------------------------
            Status: SUCCESS
